name: Retain stable and debug artifacts

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  retain-latest-complete-channel-set:
    strategy:
      fail-fast: false
      matrix:
        channel: [release, beta]
    concurrency:
      # Keep retention work in its own lock; the cleanup script checks active
      # Release runs before deleting artifacts and must not evict a queued build.
      group: itgmania-retention-${{ matrix.channel }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    steps:
      - name: Retain latest successful channel set
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CHANNEL: ${{ matrix.channel }}
        shell: bash
        run: |
          set -euo pipefail
          tmpdir=$(mktemp -d)
          trap 'rm -rf "${tmpdir}"' EXIT

          active_runs="${tmpdir}/active-runs"
          : > "${active_runs}"
          for status in queued in_progress; do
            gh api "repos/${REPOSITORY}/actions/workflows/release.yml/runs?branch=${CHANNEL}&status=${status}&per_page=100" \
              --jq '.workflow_runs[].id' >> "${active_runs}"
          done

          if [ -s "${active_runs}" ]; then
            echo "A ${CHANNEL} release run is active; skipping cleanup for this channel."
            exit 0
          fi

          latest_successful_run=$(
            gh api "repos/${REPOSITORY}/actions/workflows/release.yml/runs?branch=${CHANNEL}&status=success&per_page=1" \
              --jq '.workflow_runs[0].id // empty'
          )

          if [ -z "${latest_successful_run}" ]; then
            echo "No successful ${CHANNEL} Release run exists; deleting all completed Release artifacts for this channel."
          else
            echo "Keeping ${CHANNEL} artifact set from successful Release run ${latest_successful_run}."
          fi

          # `actions/upload-artifact` with archive disabled exposes the package
          # filename as the artifact name. Scope cleanup by the Release workflow
          # run ID and branch channel, never by a display-name convention.
          release_run_ids="${tmpdir}/release-run-ids"
          gh api --paginate "repos/${REPOSITORY}/actions/workflows/release.yml/runs?branch=${CHANNEL}&per_page=100" \
            --jq '.workflow_runs[].id' > "${release_run_ids}"

          artifact_records="${tmpdir}/artifact-records"
          CHANNEL="${CHANNEL}" gh api --paginate "repos/${REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[]
              | select(.expired == false)
              | select(.workflow_run.head_branch == env.CHANNEL)
              | [.id, .workflow_run.id]
              | @tsv' > "${artifact_records}"

          while IFS=$'\t' read -r artifact_id artifact_run_id; do
            [ -z "${artifact_id}" ] && continue
            if ! grep -Fxq "${artifact_run_id}" "${release_run_ids}"; then
              echo "Preserving artifact ${artifact_id}: its run is outside Release workflow scope."
              continue
            fi
            if [ "${artifact_run_id}" = "${latest_successful_run:-0}" ]; then
              continue
            fi
            echo "Deleting superseded ${CHANNEL} Release artifact ${artifact_id} from run ${artifact_run_id}."
            gh api --method DELETE "repos/${REPOSITORY}/actions/artifacts/${artifact_id}"
          done < "${artifact_records}"
